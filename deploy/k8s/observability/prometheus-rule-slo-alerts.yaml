apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: acos-slo-alerts
  labels:
    app.kubernetes.io/name: acos
    app.kubernetes.io/component: observability
spec:
  groups:
    - name: acos.slo
      interval: 30s
      rules:
        - alert: AcosJourneyAvailabilityBurn
          expr: |
            (
              1 -
              (
                sum(rate(acos_journey_requests_total{status="success"}[5m])) /
                clamp_min(sum(rate(acos_journey_requests_total[5m])), 1)
              )
            ) * 100 > 1
          for: 15m
          labels:
            severity: warning
            service: shopper-api
          annotations:
            summary: "Journey availability SLO burn is above 1%"
            description: "Successful journey rate has dropped below 99% over a 5-minute window."
            runbook_url: "docs/observability/slo_runbook.md"
        - alert: AcosJourneyLatencyP95High
          expr: |
            histogram_quantile(
              0.95,
              sum by (le, tenant_id, journey_type) (rate(acos_journey_duration_seconds_bucket[5m]))
            ) > 2
          for: 10m
          labels:
            severity: warning
            service: shopper-api
          annotations:
            summary: "Journey latency p95 above 2000ms"
            description: "Tenant and journey-level p95 latency has exceeded 2 seconds for 10 minutes."
            runbook_url: "docs/observability/slo_runbook.md"
        - alert: AcosTenantErrorRateHigh
          expr: |
            100 *
            sum by (tenant_id) (rate(acos_journey_requests_total{status="error"}[10m])) /
            clamp_min(sum by (tenant_id) (rate(acos_journey_requests_total[10m])), 1) > 1
          for: 10m
          labels:
            severity: critical
            service: shopper-api
          annotations:
            summary: "Tenant error rate above 1%"
            description: "At least one tenant has crossed the 1% journey error budget threshold."
            runbook_url: "docs/observability/slo_runbook.md"
