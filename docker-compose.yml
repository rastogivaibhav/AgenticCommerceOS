version: '3.9'
services:
  shopper-api:
    build: .
    ports: ["8080:8080"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - DB_POOL_MAX=${DB_POOL_MAX:-10}
      - SHOPPER_API_KEYS=${SHOPPER_API_KEYS}
      - ALLOW_INSECURE_DEV_AUTH=${ALLOW_INSECURE_DEV_AUTH:-0}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
      - TENANT_RATE_LIMIT_PER_MINUTE=${TENANT_RATE_LIMIT_PER_MINUTE:-120}
      - TENANT_DAILY_QUOTA=${TENANT_DAILY_QUOTA:-5000}
      - TENANT_MAX_IN_FLIGHT=${TENANT_MAX_IN_FLIGHT:-8}
      - PYTHONPATH=/app
      - APP_VERSION=${APP_VERSION:-1.0.0}
      - OPS_ENVIRONMENT=${OPS_ENVIRONMENT:-dev}
    restart: unless-stopped

  ops-api:
    build: .
    command: uvicorn apps.ops_api.main:app --host 0.0.0.0 --port 8081
    ports: ["8081:8081"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://acos:${DB_PASSWORD}@db:5432/acos
      - DB_POOL_MAX=${DB_POOL_MAX:-10}
      - OPS_JWT_SECRET=${OPS_JWT_SECRET}
      - ALLOW_INSECURE_DEV_AUTH=${ALLOW_INSECURE_DEV_AUTH:-0}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS}
      - PYTHONPATH=/app
      - APP_VERSION=${APP_VERSION:-1.0.0}
      - OPS_ENVIRONMENT=${OPS_ENVIRONMENT:-dev}
    restart: unless-stopped

  chat-api:
    build:
      context: .
      dockerfile: Dockerfile.chat_api
    ports: ["8001:8001"]
    environment:
      - SLACK_BOT_TOKEN=${SLACK_BOT_TOKEN:-}
      - SLACK_SIGNING_SECRET=${SLACK_SIGNING_SECRET:-}
      - SLACK_WORKSPACE_ID=${SLACK_WORKSPACE_ID:-default}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS}
      - PYTHONPATH=/app
      - APP_VERSION=${APP_VERSION:-1.0.0}
      - OPS_ENVIRONMENT=${OPS_ENVIRONMENT:-dev}
    restart: unless-stopped

  db:
    image: postgres:15
    environment:
      POSTGRES_DB: acos
      POSTGRES_USER: acos
      POSTGRES_PASSWORD: ${DB_PASSWORD}   # FIX-04: no hardcoded password
    # Local-only bind for migration/RLS validation; not publicly exposed.
    ports:
      - "${DB_BIND_ADDRESS:-127.0.0.1}:${DB_HOST_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U acos -d acos"]
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  pgdata:

