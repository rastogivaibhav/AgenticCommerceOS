version: '3.9'
services:
  shopper-api:
    build: .
    ports: ["8080:8080"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - DB_POOL_MAX=${DB_POOL_MAX:-10}
      - SHOPPER_API_KEYS=${SHOPPER_API_KEYS}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
      - PYTHONPATH=/app
      - APP_VERSION=${APP_VERSION:-1.0.0}
      - OPS_ENVIRONMENT=${OPS_ENVIRONMENT:-dev}
    restart: unless-stopped

  ops-api:
    build: .
    command: uvicorn apps.ops_api.main:app --host 0.0.0.0 --port 8081
    ports: ["8081:8081"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://acos:${DB_PASSWORD}@db:5432/acos
      - DB_POOL_MAX=${DB_POOL_MAX:-10}
      - OPS_JWT_SECRET=${OPS_JWT_SECRET}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS}
      - PYTHONPATH=/app
      - APP_VERSION=${APP_VERSION:-1.0.0}
      - OPS_ENVIRONMENT=${OPS_ENVIRONMENT:-dev}
    restart: unless-stopped

  db:
    image: postgres:15
    environment:
      POSTGRES_DB: acos
      POSTGRES_USER: acos
      POSTGRES_PASSWORD: ${DB_PASSWORD}   # FIX-04: no hardcoded password
    # FIX-04: DB port NOT exposed to host — internal network only
    expose:
      - "5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U acos -d acos"]
      interval: 3s
      timeout: 3s
      retries: 10

  temporal:
    image: temporalio/auto-setup:1.25.1
    ports:
      - "7233:7233"
    environment:
      - DB=postgresql12
      - DB_PORT=5432
      - POSTGRES_USER=acos
      - POSTGRES_PWD=${DB_PASSWORD}
      - POSTGRES_SEEDS=db
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  temporal-ui:
    image: temporalio/ui:2.31.2
    ports:
      - "8088:8080"
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CORS_ORIGINS=http://localhost:8088
    depends_on:
      - temporal
    restart: unless-stopped

  temporal-worker:
    build: .
    command: python -m acosplatform.temporal.worker
    depends_on:
      - temporal
      - db
    environment:
      - TEMPORAL_HOST=temporal:7233
      - DATABASE_URL=postgresql://acos:${DB_PASSWORD}@db:5432/acos
      - DB_POOL_MAX=${DB_POOL_MAX:-10}
      - PYTHONPATH=/app
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
    restart: unless-stopped

volumes:
  pgdata:
